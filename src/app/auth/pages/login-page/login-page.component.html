<div class="login-container">
  <mat-card class="login-card">
    <mat-card-title class="text-center">Iniciar Sesión</mat-card-title>
    
    <mat-card-content>
      <form class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input type="text" matInput placeholder="Nombre de usuario">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input type="password" matInput placeholder="Contraseña">
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width"
        (click)="login()">
          
          <mat-icon>login</mat-icon>
          Ingresar
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions class="text-center">
      <a routerLink="/auth/new-account">¿No tienes cuenta? Regístrate</a>
    </mat-card-actions>
  </mat-card>
</div>
