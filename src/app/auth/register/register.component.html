<div class="container-fluid vh-100">
  <div class="row h-100">

    <!-- Lado izquierdo: Video -->
    <div class="col-md-6 d-none d-md-flex align-items-center p-0">
      <video autoplay muted loop playsinline class="w-100 h-100 object-fit-cover">
        <source src="assets/videos/video1.mp4" type="video/mp4" />
        Tu navegador no soporta el video.
      </video>
    </div>

    <!-- Lado derecho: Formulario -->
    <div class="col-md-6 d-flex align-items-center justify-content-center bg-light">
      <div class="w-75">
        <h2 class="mb-4 text-center">Registrarse</h2>
        <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="email" formControlName="email" placeholder="Ingresa tu correo" />
            <div class="text-danger small" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
            {{ formUtils.getFieldError(registerForm, 'email') }}
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
              <input 
              [type]="showPassword ? 'text' : 'password'"
              class="form-control" 
              id="password" 
              formControlName="password" 
              placeholder="Crea una contraseña" 
              />
                
              <button type="button" 
              class="btn btn-outline-secondary" 
                (click)="togglePasswordVisibility()" 
                    aria-label="Mostrar u ocultar contraseña">
                <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
            
            <div class="text-danger small" *ngIf="formUtils.isValidField(registerForm, 'password')">
              {{ formUtils.getFieldError(registerForm, 'password') }}
            </div>
          </div>



          <!-- Confirm Password -->
          <div class="mb-3">
            <label for="confirm-password" 
            class="form-label">Confirmar contraseña</label>
            <input 
            type="password" 
            class="form-control" 
            id="confirm-password" 
            formControlName="confirmPassword" 
            placeholder="Repite tu contraseña" />
            
            
            <div class="text-danger small" *ngIf="formUtils.isValidField(registerForm, 'confirmPassword')">
              {{ formUtils.getFieldError(registerForm, 'confirmPassword') }}
            </div>

          </div>

          <!-- Botones -->
          <button type="submit" class="btn btn-success w-50 d-block mx-auto" [disabled]="registerForm.invalid">
            Registrarse
          </button>
          <button type="button" (click)="goToLogin()" class="btn btn-outline-dark w-50 d-block mx-auto mt-3">
            Iniciar Sesión
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
